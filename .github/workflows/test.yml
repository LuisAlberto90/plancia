name: test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Lint (ruff) and security scan (bandit)
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        run: |
          pip install ruff bandit
          ruff check fcore factory.py installa.py tests
          bandit -q -r fcore factory.py installa.py -ll
      - name: Tests
        env:
          PYTHONIOENCODING: utf-8
        run: |
          pip install pyyaml
          python tests/run_tests.py
