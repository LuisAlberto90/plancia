function gfit(){const w=document.getElementById('gw'),s=document.querySelector('#gin svg');if(!w||!s)return;const sw=+s.getAttribute('width')||1,sh=+s.getAttribute('height')||1;if(s.dataset.vert){const k=Math.min(1.15,(w.clientWidth-24)/sw);GV.h=Math.round(sh*k+30);w.style.height=GV.h+'px';GV.k=k;GV.x=(w.clientWidth-sw*k)/2;GV.y=12;GV.fit=1;gapply();return}const kw=Math.max(0.7,Math.min(1.2,(w.clientWidth-24)/sw));GV.h=Math.round(Math.max(150,Math.min(1000,sh*kw+28)));w.style.height=GV.h+'px';const k=Math.max(0.7,Math.min(1.2,(w.clientWidth-24)/sw,(w.clientHeight-24)/sh));GV.k=k;GV.x=(w.clientWidth-sw*k)/2;GV.y=(w.clientHeight-sh*k)/2;GV.fit=1;gapply()}
function gbind(){const w=document.getElementById('gw');if(!w)return;
 w.addEventListener('wheel',e=>{if(!(e.ctrlKey||e.metaKey))return;e.preventDefault();const r=w.getBoundingClientRect();gz(e.deltaY<0?1.15:1/1.15,e.clientX-r.left,e.clientY-r.top)},{passive:false});

function qs(x){const u=new URLSearchParams(location.search);Object.entries(x||{}).forEach(([k,v])=>v&&u.set(k,v));const s=u.toString();return s?'?'+s:''}
function okBox(){const el=document.getElementById('ok');if(!el)return;const L=[];(PR&&PR.progetti||[]).forEach(p=>(p.sessioni||[]).forEach(s=>{if(s.stato=='permesso')L.push([p,s])}));

function load(){if(load.in)return;load.in=1;load.n=(load.n||0)+1;fetch('api/state'+qs({p:proj})).then(r=>{if(r.status==403)throw new Error('il progetto "'+proj+'" non è tra quelli che la Plancia conosce: torna su Progetti e premi Piano e cosa ha fatto, oppure lancia Installa-in-un-progetto su quella cartella');return r.json()}).then(d=>{const k=JSON.stringify(d,(a,v)=>a=='aggiornato'?0:v);if(k!==load.k){load.k=k;S=d;draw()}}).catch(e=>{S={errore_pannello:'Risposta del pannello non valida o pannello fermo: '+e};draw()}).finally(()=>{load.in=0})}
