.tb{background:var(--card);color:var(--acc);border:1px solid var(--line);border-radius:6px;padding:5px 12px;font:inherit;cursor:pointer}.pbox{margin-top:10px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px}.pbox.wip{border-color:#e3a33b}.pbox.run{border-color:#5b8cff}.pbox.ok{border-color:#3fb87a}.pbox button{margin-top:4px}.spin{display:inline-block;width:10px;height:10px;border:2px solid #e3a33b;border-top-color:transparent;border-radius:50%;animation:sp 1s linear infinite;vertical-align:-1px}@keyframes sp{to{transform:rotate(360deg)}}

.testa .dom{font-size:1.15em;font-weight:600;margin-top:4px}.testa button{background:none;border:1px solid var(--line);color:var(--acc);border-radius:6px;padding:6px 12px;font:inherit;cursor:pointer}
@media(min-width:1500px){main{max-width:1900px}.duo:not(.solo){display:grid;grid-template-columns:minmax(0,1.35fr) minmax(420px,1fr);gap:16px;align-items:start}.duo .lato{position:sticky;top:8px;max-height:calc(100vh - 60px);overflow:auto}}
.sep{width:1px;background:var(--line);margin:0 6px}.psel{display:flex;align-items:center;gap:6px;margin-right:6px}.psel select,.rqsel{background:var(--card);color:var(--fg);border:1px solid var(--acc);border-radius:8px;padding:7px 10px;font:inherit;font-weight:600;max-width:340px}.rqsel{max-width:100%;flex:1;min-width:280px;font-weight:500}.stab{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}.stab button{background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:99px;padding:6px 14px;font:inherit;cursor:pointer}.stab button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
</style></head><body><main>
<h1 id="t">Plancia</h1><div class="sub" id="s"></div>
<div id="ok"></div><nav id="nav"></nav><div id="v"></div><div id="bar" class="bar"></div>
<script>

const PROVE_ON=(()=>{try{if(new URLSearchParams(location.search).get('prove')=='1')localStorage.setItem('plancia_prove','1');return localStorage.getItem('plancia_prove')=='1'||location.hash=='#prove'}catch(e){return location.hash=='#prove'}})();
const E=s=>String(s??'').replace(/[&<>"']/g,x=>({"'":'&#39;','&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[x])),

function canon(s){s=String(s||'da_fare');const u=s.toUpperCase();if(COL[u])return u;return({problema:'BLOCCATO',aspetta_utente:'BLOCCATO',aspetta:'BLOCCATO'})[s.toLowerCase()]||'DA_FARE'}
const PALLA={lavora:'🟢',permesso:'🟠',aspetta:'🟣',errore:'🔴',loop:'🔴',fermo:'🔴',inattivo:'⚪'};
function cambia(r){proj=r;S=null;ST=null;rk=null;sel=null;load.k=null;load.in=0;if(tab=='progetti')tab='piano';location.hash=tab;nav();draw();load()}
function nav(){const vis=TABS.filter(([k])=>!((k=='progetti'||k=='prove')&&window.SNAPSHOT)&&!(k=='prove'&&!PROVE_ON&&tab!='prove')&&!(k=='task'&&S&&S.modo!='governata'&&!(S.task||[]).some(x=>!['VERIFICATO','ABBANDONATO','CONFLUITO','ESEGUITO'].includes(x.stato))));
 const pp=PR&&PR.progetti?PR.progetti.find(x=>x.radice==proj):null,bt=([k,n])=>{let x='';if(k=='salute'&&S&&S.salute&&S.salute.stato!='OK'&&S.salute.stato!='INFO')x=' '+B(S.salute.stato,'!');if(k=='strumenti'&&pp&&pp.proposte)x=' '+B('ATTENZIONE',pp.proposte+(pp.proposte==1?' proposta':' proposte'));if(k=='progetti'&&PR){const c=PR.conteggi,u=(c.errore||0)+(c.permesso||0)+(c.fermo||0)+(c.loop||0);x=u?' '+B('KO',u):(c.aspetta?' '+B('ATTENZIONE',c.aspetta):'')}return`<button class="${tab==k?'on':''}" onclick="go('${k}')">${n}${x}</button>`};
 const casa=vis.filter(([k])=>k=='progetti').map(bt).join(''),resto=vis.filter(([k])=>k!='progetti').map(bt).join('');
 const scelta=PR&&PR.progetti&&PR.progetti.length&&!window.SNAPSHOT?`<span class=psel><span class=sub>Progetto:</span> <select onchange="cambia(this.value)">${proj?'':'<option value="">scegli…</option>'}${PR.progetti.map(x=>`<option value="${E(x.radice)}" ${x.radice==proj?'selected':''}>${PALLA[x.stato]||'⚪'} ${E(x.nome)}${x.proposte?' · 💡'+x.proposte:''}</option>`).join('')}</select></span>`:'';
 document.getElementById('nav').innerHTML=casa+(casa?'<span class=sep></span>':'')+scelta+resto}
function scegli(){if(proj||!PR||!PR.progetti||!PR.progetti.length)return;const ps=PR.progetti.filter(x=>x.plancia!==false);const et=x=>Math.min(...(x.sessioni||[]).map(s=>s.eta==null?1e9:s.eta),1e9);const b=(ps.length?ps:PR.progetti).slice().sort((a,c)=>et(a)-et(c))[0];if(b&&b.radice){proj=b.radice;S=null;if(typeof load=='function')load.k=null}}
function go(k){if(k=='richieste'||k=='riprendere')k='piano';if(k=='prove')PV=null;if(k=='strumenti')ST=null;if(k!='progetti')scegli();if(k!='progetti'&&typeof load=='function')setTimeout(load,0);tab=k;location.hash=k;nav();draw()}
function dettaglio(p){if(!sel)return'';const s=p.steps.find(x=>x.id==sel);if(!s)return'';
 const k=['stato','dettaglio','dipende_da','evidence','agg'],LB={stato:'stato',dettaglio:'nota / motivo',dipende_da:'aspetta i passi',evidence:'prove',agg:'aggiornato'};
 const h=(s.history||[]).map(x=>`${E(x.ts)} ${E(x.tipo)} ${E(x.motivo||x.testo||x.causa||'')}`).join('<br>');
 const I={ok:'✓',errore:'✗','in corso':'⏳'};const az=(s.azioni||[]).map(a=>`${I[a.esito]||'·'} ${E(a.tipo)}: <code>${E(a.cosa||'')}</code>${a.errore?`<br><span style="color:var(--bad);margin-left:18px">errore: ${E(a.errore)}</span>`:''}${a.nota?`<br><span class=sub style="margin-left:18px">${E(a.nota)}</span>`:''}`).join('<br>');
 return`<table class="det"><tr><th colspan=2>Passo ${E(s.id)} · ${E(s.testo)}</th></tr>${az?`<tr><td>cosa ha fatto</td><td>${az}</td></tr>`:''}`+k.filter(q=>s[q]!=null&&s[q]!==''&&!(Array.isArray(s[q])&&!s[q].length)).map(q=>`<tr><td>${LB[q]||q}</td><td>${E(Array.isArray(s[q])?s[q].join(', '):q=='stato'?NOME[canon(s[q])]:q=='agg'?String(s[q]).slice(11,16):s[q])}</td></tr>`).join('')+(h?`<tr><td>storico</td><td>${h}</td></tr>`:'')+((s.note||[]).length?`<tr><td>note</td><td>${s.note.map(n=>E(n.testo)).join('<br>')}</td></tr>`:'')+'</table>'}
function cort(x,n){x=String(x||'');return x.length>n?x.slice(0,n-1)+'…':x}
function nodoExtra(s){const az=s.azioni||[],er=az.filter(a=>a.esito=='errore').length,c=canon(s.stato);
 if(c=='BLOCCATO'&&(s.blocker_reason||s.dettaglio))return`<div style="color:${css('--bad')};margin-top:2px">⚠ ${E(cort(s.blocker_reason||s.dettaglio,52))}</div>`;
 if(s.fuori)return`<div style="color:${css('--wait')};margin-top:2px">⚠ ${az.length} modifiche: ${E(az.slice(0,2).map(a=>a.cosa).join(', ').slice(0,60))}</div>`;
 if((c=='FATTO'||c=='VERIFICATO')&&s.dettaglio)return`<div style="color:${css('--ok')};margin-top:2px">→ ${E(cort(s.dettaglio,52))}${az.length?` <span style="color:${css('--mut')}">· ${az.length} azioni</span>`:''}</div>`;
 if(c=='NON_NECESSARIO'&&s.dettaglio)return`<div style="color:${css('--mut')};margin-top:2px">saltato: ${E(String(s.dettaglio).slice(0,55))}</div>`;
 return az.length?`<div style="color:${css('--mut')};margin-top:2px">${az.length} azioni${er?` · <span style="color:${css('--bad')}">${er} errori</span>`:''}</div>`:''}
function grafo(p){const P=p.steps,by={},L={};P.forEach(s=>by[s.id]=s);const lv=(s,v=[])=>L[s.id]??=(v.includes(s.id)?0:(s.dipende_da||[]).map(d=>by[d]).filter(Boolean).reduce((m,q)=>Math.max(m,lv(q,v.concat(s.id))+1),0));P.forEach(s=>lv(s));
 const cols={};P.forEach(s=>(cols[L[s.id]]??=[]).push(s));const W=300,H=96,pos={};let mh=0;const nl=Object.keys(cols).length,vert=nl>4;   // catene lunghe: dall'alto in basso, leggibili senza zoom
 Object.keys(cols).forEach(k=>cols[k].forEach((s,i)=>{pos[s.id]=vert?[i*(W+44)+6,k*(H+44)+6]:[k*(W+44)+6,i*(H+14)+6];mh=Math.max(mh,i+1)}));
 const crit=new Set(p.critico||[]);let g='';
 P.forEach(s=>(s.dipende_da||[]).forEach(d=>{if(pos[d]){const a=pos[d],b=pos[s.id],c=crit.has(d)&&crit.has(s.id);g+=`<path d="${vert?`M${a[0]+W/2},${a[1]+H}C${a[0]+W/2},${a[1]+H+22} ${b[0]+W/2},${b[1]-22} ${b[0]+W/2},${b[1]}`:`M${a[0]+W},${a[1]+H/2}C${a[0]+W+25},${a[1]+H/2} ${b[0]-25},${b[1]+H/2} ${b[0]},${b[1]+H/2}`}" fill=none stroke="${css(c?'--wait':'--todo')}" stroke-width="${c?2.5:1.3}"/>`}}));
 P.forEach(s=>{const[x,y]=pos[s.id],c=canon(s.stato),t=(s.testo||'').length>70?s.testo.slice(0,68)+'…':(s.testo||'');

function corto(s){s=String(s||'');const r=String(proj||'').replace(/\\/g,'/').toLowerCase();let x=s.replace(/\\/g,'/');if(r&&x.toLowerCase().startsWith(r+'/'))x=x.slice(r.length+1);return x}
function attivita(r,pl){if(!r||!(r.attivita||[]).length)return'';
 const VERBO={leggi:['Ha letto','Sta leggendo'],modifica:['Ha modificato','Sta modificando'],comando:['Ha eseguito','Sta eseguendo'],cerca:['Ha cercato','Sta cercando'],['sotto-agente']:['Ha affidato a un sotto-agente','Ha affidato a un sotto-agente'],domanda:['Ti ha chiesto','Ti sta chiedendo'],piano:['Ha proposto un piano','Propone un piano'],web:['Ha consultato','Sta consultando'],altro:['Ha usato lo strumento','Sta usando lo strumento']};
 const A=r.attivita,cont=t=>A.filter(a=>a.tipo==t).length,passi={};(pl?pl.steps:[]).forEach(s=>passi[s.id]=s);

 const ora=Date.now(),hm=ts=>{const d=new Date(ts);return isNaN(d)?'':d.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'})},da=ts=>{const s=(ora-new Date(ts))/1000;return isNaN(s)?'':s<90?Math.round(s)+' s':Math.round(s/60)+' min'};
 const riga=a=>{const v=VERBO[a.tipo]||VERBO.altro,inc=a.esito=='in corso',err=a.esito=='errore',cmd=a.tipo=='comando',o=corto(a.cosa);

let GV={k:1,x:0,y:0,id:null,fit:1},GD=null;
function gwrap(svg,id){if(GV.id!==id)GV={k:1,x:0,y:0,id,fit:1,h:0};
 return`<div class=gtool><button onclick="gz(1.25)">+</button><button onclick="gz(0.8)">−</button><button onclick="gfit()">Adatta</button><span class=sub>Ctrl + rotella = zoom · trascina = sposta · clic su un passo = dettaglio · la rotella da sola scorre la pagina</span></div><div id=gw class=gw style="${GV.h?`height:${GV.h}px`:``}"><div id=gin style="transform:translate(${GV.x}px,${GV.y}px) scale(${GV.k})">${svg}</div></div>`}
function gapply(){const g=document.getElementById('gin');if(g)g.style.transform=`translate(${GV.x}px,${GV.y}px) scale(${GV.k})`}
function gz(fz,cx,cy){const w=document.getElementById('gw');if(!w)return;cx??=w.clientWidth/2;cy??=w.clientHeight/2;GV.x=cx-(cx-GV.x)*fz;GV.y=cy-(cy-GV.y)*fz;GV.k*=fz;GV.fit=0;gapply()}
function gfit(){const w=document.getElementById('gw'),s=document.querySelector('#gin svg');if(!w||!s)return;const sw=+s.getAttribute('width')||1,sh=+s.getAttribute('height')||1;if(s.dataset.vert){const k=Math.min(1.15,(w.clientWidth-24)/sw);GV.h=Math.round(sh*k+30);w.style.height=GV.h+'px';GV.k=k;GV.x=(w.clientWidth-sw*k)/2;GV.y=12;GV.fit=1;gapply();return}const kw=Math.max(0.7,Math.min(1.2,(w.clientWidth-24)/sw));GV.h=Math.round(Math.max(150,Math.min(1000,sh*kw+28)));w.style.height=GV.h+'px';const k=Math.max(0.7,Math.min(1.2,(w.clientWidth-24)/sw,(w.clientHeight-24)/sh));GV.k=k;GV.x=(w.clientWidth-sw*k)/2;GV.y=(w.clientHeight-sh*k)/2;GV.fit=1;gapply()}
function gbind(){const w=document.getElementById('gw');if(!w)return;
 w.addEventListener('wheel',e=>{if(!(e.ctrlKey||e.metaKey))return;e.preventDefault();const r=w.getBoundingClientRect();gz(e.deltaY<0?1.15:1/1.15,e.clientX-r.left,e.clientY-r.top)},{passive:false});
 w.addEventListener('mousedown',e=>{if(e.target.closest('g[onclick]'))return;GD=[e.clientX-GV.x,e.clientY-GV.y];w.style.cursor='grabbing'});
 if(GV.fit||!GV.h)gfit()}
window.addEventListener('resize',()=>{if(tab=='piano'&&document.getElementById('gw'))gfit()});
window.addEventListener('mouseup',()=>{GD=null;const w=document.getElementById('gw');if(w)w.style.cursor='grab'});
window.addEventListener('mousemove',e=>{if(GD){GV.x=e.clientX-GD[0];GV.y=e.clientY-GD[1];GV.fit=0;gapply()}});
function legenda(v){const L={DA_FARE:'da fare',IN_CORSO:'in corso',FATTO:'fatto',VERIFICATO:'verificato',BLOCCATO:'bloccato',NON_NECESSARIO:'non necessario'};
 return`<div class=leg>${Object.keys(L).map(k=>`<span style="--c:var(${COL[k]})">${L[k]} ${(v.conteggi||{})[k]||0}</span>`).join('')}</div>`}
function oggi(ts){const d=new Date(),l=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');return ts&&(ts.startsWith(l)||ts.startsWith(d.toISOString().slice(0,10)))}
function barra(){const b=document.getElementById('bar');if(!b)return;let h='';
 if(tab=='progetti'&&PR){h=`Progetti: <b>${PR.progetti.length}</b> · agenti aperti: <b>${PR.progetti.reduce((a,p)=>a+p.sessioni.length,0)}</b> · token oggi: <b>${f(PR.progetti.reduce((a,p)=>a+p.token_oggi,0))}</b> · ultimo refresh: <b>${E(PR.aggiornato.slice(11))}</b>`}
 else if(S){const W=S.worker||{sessioni:[]},tu=W.sessioni.flatMap(s=>s.turni).filter(x=>oggi(x.ts)),sm=k=>tu.reduce((a,x)=>a+(x[k]||0),0),s0=W.sessioni.slice().sort((a,c)=>c.mtime-a.mtime)[0];
  const RQ=(S.richieste||[]).filter(r=>oggi(r.inizio)),rs=k=>RQ.reduce((a,r)=>a+(r[k]||0),0);h=`Progetto: <b>${E(S.progetto)}</b> · Agente più recente: <b>${E(s0?s0.fonte:'-')}</b> · Oggi: <b>${RQ.length}</b> richieste · token di lavoro <b>${f(rs('token_lavoro'))}</b> · riletti <b>${f(rs('token_riletti'))}</b> · Ultimo refresh: <b>${E((S.aggiornato||'').slice(11))}</b>`}
 b.innerHTML=h}
function aperti(){const m={};document.querySelectorAll('#v details[data-k]').forEach(d=>m[d.dataset.k]=d.open);return m}
function riapri(m){document.querySelectorAll('#v details[data-k]').forEach(d=>{if(d.dataset.k in m)d.open=m[d.dataset.k]})}
function errBox(x){return`<div class="card" style="border:2px solid var(--bad)"><h2>La Plancia non riesce a leggere i dati di questo progetto</h2><p class=sub>Copia il testo qui sotto e mandalo a chi ti supporta (è anche nella finestra dove gira il pannello).</p><pre style="white-space:pre-wrap">${E(x)}</pre></div>`}
function vecchio(){return HV.startsWith('__')}
function draw(){if(vecchio()){document.getElementById('v').innerHTML=errBox('Questa pagina sta parlando con un pannello VECCHIO ancora acceso. Chiudi tutte le finestre nere della Plancia e riaprila (Apri-Plancia.cmd o Installa-in-un-progetto.cmd).');return}
 if(tab!='progetti'&&S&&S.errore_pannello){nav();document.getElementById('t').textContent='Plancia · errore';document.getElementById('v').innerHTML=errBox(S.errore_pannello);return}
 if(tab!='progetti'&&!S){nav();document.getElementById('t').textContent='Plancia';document.getElementById('v').innerHTML='<div class="card"><p class=sub>Carico i dati del progetto…</p></div>';return}
 if(tab=='progetti'){nav();document.getElementById('t').textContent='Plancia · Progetti';document.getElementById('s').textContent=PR?'aggiornato '+PR.aggiornato+' · sola lettura':'';const m=aperti();let hp;try{hp=vProgetti()}catch(e){hp=errBox('Errore nel disegnare Progetti: '+e+'\n'+(e.stack||''))}document.getElementById('v').innerHTML=hp;riapri(m);barra();return}if(!S)return;document.getElementById('t').textContent='Plancia · '+S.progetto;document.getElementById('s').textContent='aggiornato '+S.aggiornato+' · task corrente: '+(S.corrente||'nessuno')+' · sola lettura';
 nav();const m=aperti();let h;try{h=({prove:vProve,strumenti:vStrumenti,piano:vPiano,task:vTask,richieste:vRichieste,riprendere:vRiprendere,worker:vWorker,handoff:vRiprendere,salute:vSalute}[tab]||vPiano)()}catch(e){h=errBox('Errore nel disegnare la pagina '+tab+': '+e+'\n'+(e.stack||''))}document.getElementById('v').innerHTML=h;riapri(m);try{gbind()}catch(e){}barra()}
function qs(x){const u=new URLSearchParams(location.search);Object.entries(x||{}).forEach(([k,v])=>v&&u.set(k,v));const s=u.toString();return s?'?'+s:''}
function okBox(){const el=document.getElementById('ok');if(!el)return;const L=[];(PR&&PR.progetti||[]).forEach(p=>(p.sessioni||[]).forEach(s=>{if(s.stato=='permesso')L.push([p,s])}));
 document.title=(L.length?'(!) OK richiesto · ':'')+'Plancia';if(!L.length){el.innerHTML='';return}
 el.innerHTML='<div class=okb><b>La chat aspetta un tuo OK</b><span class=sub> — vai nella chat e premi <b>Allow</b> (o Skip). La Plancia non approva al posto tuo.</span>'+L.map(([p,s])=>'<div class=okr><b>'+E(p.nome)+'</b> · '+E(AGENTE[s.fonte]||s.fonte)+' vuole: <code>'+E(s.attesa||(s.in_sospeso||[]).join(', ')||'un\'azione')+'</code> <span class=sub>(da '+E(s.eta_txt)+')</span></div>').join('')+'</div>'}
function loadP(){if(loadP.in)return;loadP.in=1;fetch('api/panoramica'+qs()).then(r=>r.json()).then(d=>{const k=JSON.stringify(d,(a,v)=>a=='aggiornato'||a=='eta'||a=='eta_txt'?0:v);notifica(d);PR=d;okBox();if(tab!='progetti'&&!proj){scegli();if(proj)setTimeout(load,0)}const now=Date.now();if(k!==loadP.k||now-(loadP.t||0)>20000){loadP.k=k;loadP.t=now;if(tab=='progetti')draw();else{nav();barra()}}}).catch(()=>{}).finally(()=>{loadP.in=0})}
function load(){if(load.in)return;load.in=1;load.n=(load.n||0)+1;fetch('api/state'+qs({p:proj})).then(r=>{if(r.status==403)throw new Error('il progetto "'+proj+'" non è tra quelli che la Plancia conosce: torna su Progetti e premi Piano e cosa ha fatto, oppure lancia Installa-in-un-progetto su quella cartella');return r.json()}).then(d=>{const k=JSON.stringify(d,(a,v)=>a=='aggiornato'?0:v);if(k!==load.k){load.k=k;S=d;draw()}}).catch(e=>{S={errore_pannello:'Risposta del pannello non valida o pannello fermo: '+e};draw()}).finally(()=>{load.in=0})}
if(window.SNAPSHOT){S=window.SNAPSHOT;draw()}else{loadP();load();draw();setInterval(()=>{if(document.hidden)return;loadP();if(tab!='progetti')load()},1500);document.addEventListener('visibilitychange',()=>{if(!document.hidden){loadP();if(tab!='progetti')load()}})}
</script></main></body></html>
