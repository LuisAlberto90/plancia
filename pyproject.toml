[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "plancia"
version = "0.16.2"
description = "Piano, task, guardie e handoff visibili per Claude Code, Copilot e ogni host MCP"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
yaml = ["pyyaml"]

[project.scripts]
plancia = "factory:cli"
lavagna = "factory:cli"

[tool.setuptools]
py-modules = ["factory"]
packages = ["fcore"]

[tool.setuptools.package-data]
fcore = ["pannello.html"]
